name: CI Pipeline

on:
  push:
    branches: [main, level2, level3]
  pull_request:
    branches: [main, level2, level3]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build TypeScript
        run: npm run build

      - name: Build frontend
        run: npm run frontend:build

      - name: Start Local Devnet
        run: |
          docker compose up -d
          sleep 15

      - name: Deploy Contract to Local Devnet
        run: npm run deploy -- --network undeployed

      - name: Run Integration Tests
        run: npm test -- --network undeployed
